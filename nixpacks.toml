[phases.setup]
nixPkgs = ["python39", "python39Packages.pip", "python39Packages.virtualenv"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "source /opt/venv/bin/activate",
  "pip install --upgrade pip",
  "pip install --no-cache-dir Flask==2.3.3",
  "pip install --no-cache-dir flask-cors==4.0.0",
  "pip install --no-cache-dir numpy==1.24.3",
  "pip install --no-cache-dir requests==2.31.0",
  "pip install --no-cache-dir gunicorn==21.2.0",
  "pip install --no-cache-dir Pillow==10.0.1",
  "pip install --no-cache-dir opencv-python-headless==4.8.1.78",
  "pip install --no-cache-dir scikit-image==0.21.0"
]

[start]
cmd = "source /opt/venv/bin/activate && gunicorn --bind 0.0.0.0:$PORT app:app --timeout 300 --workers 1 --max-requests 100 --memory-limit 800"
