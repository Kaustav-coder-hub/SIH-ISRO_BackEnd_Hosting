[phases.setup]
nixPkgs = ["python39", "pkg-config"]

[phases.install]
cmds = [
  "pip install --no-cache-dir --no-deps Flask==2.3.3",
  "pip install --no-cache-dir --no-deps flask-cors==4.0.0",
  "pip install --no-cache-dir --no-deps numpy==1.24.3",
  "pip install --no-cache-dir --no-deps requests==2.31.0",
  "pip install --no-cache-dir --no-deps gunicorn==21.2.0",
  "pip install --no-cache-dir --no-deps Pillow==10.0.1",
  "pip install --no-cache-dir opencv-python-headless==4.8.1.78",
  "pip install --no-cache-dir scikit-image==0.21.0"
]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT app:app --timeout 300 --workers 1"
